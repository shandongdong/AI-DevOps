<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>高保真交互原型 - 用户管理</title>
  <link rel="stylesheet" href="https://unpkg.com/element-ui@2.15.14/lib/theme-chalk/index.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <div class="app-container">
      <!-- 面包屑导航 -->
      <div class="breadcrumb-area">
        <el-breadcrumb separator="/">
          <el-breadcrumb-item><a href="index.html">首页</a></el-breadcrumb-item>
          <el-breadcrumb-item>用户管理</el-breadcrumb-item>
          <el-breadcrumb-item>用户列表</el-breadcrumb-item>
        </el-breadcrumb>
      </div>

      <!-- 搜索筛选区 -->
      <div class="search-area" v-show="showSearch">
        <el-form :model="queryParams" ref="queryForm" :inline="true" size="small">
          <el-form-item prop="name">
            <span slot="label">
              姓名
              <el-tooltip content="请输入用户真实姓名" placement="top">
                <i class="el-icon-info help-icon"></i>
              </el-tooltip>
            </span>
            <el-input v-model="queryParams.name" placeholder="请输入姓名" clearable style="width:180px" @keyup.enter.native="handleQuery"></el-input>
          </el-form-item>
          <el-form-item label="手机号" prop="phone">
            <el-input v-model="queryParams.phone" placeholder="请输入手机号" clearable style="width:180px" @keyup.enter.native="handleQuery"></el-input>
          </el-form-item>
          <el-form-item prop="deptId">
            <span slot="label">
              部门
              <el-tooltip content="选择用户所属的组织部门" placement="top">
                <i class="el-icon-info help-icon"></i>
              </el-tooltip>
            </span>
            <el-select v-model="queryParams.deptId" placeholder="请选择部门" clearable filterable style="width:180px">
              <el-option v-for="item in deptOptions" :key="item.value" :label="item.label" :value="item.value"></el-option>
            </el-select>
          </el-form-item>
          <el-form-item label="状态" prop="status">
            <el-select v-model="queryParams.status" placeholder="全部" clearable style="width:140px">
              <el-option v-for="item in statusOptions" :key="item.value" :label="item.label" :value="item.value"></el-option>
            </el-select>
          </el-form-item>
          <el-form-item prop="roles" v-show="searchExpanded">
            <span slot="label">
              角色
              <el-tooltip content="选择用户拥有的系统角色" placement="top">
                <i class="el-icon-info help-icon"></i>
              </el-tooltip>
            </span>
            <el-select v-model="queryParams.roles" placeholder="请选择角色" multiple collapse-tags clearable style="width:220px">
              <el-option v-for="item in roleOptions" :key="item.value" :label="item.label" :value="item.value"></el-option>
            </el-select>
          </el-form-item>
          <el-form-item label="性别" prop="gender" v-show="searchExpanded">
            <el-select v-model="queryParams.gender" placeholder="全部" clearable style="width:120px">
              <el-option v-for="item in genderOptions" :key="item.value" :label="item.label" :value="item.value"></el-option>
            </el-select>
          </el-form-item>
          <el-form-item label="入职日期" prop="entryDateRange" v-show="searchExpanded">
            <el-date-picker v-model="queryParams.entryDateRange" type="daterange" range-separator="至" start-placeholder="开始日期" end-placeholder="结束日期" value-format="yyyy-MM-dd" style="width:340px" unlink-panels></el-date-picker>
          </el-form-item>
          <el-form-item>
            <el-button type="primary" icon="el-icon-search" size="mini" @click="handleQuery">搜索</el-button>
            <el-button icon="el-icon-refresh" size="mini" @click="resetQuery">重置</el-button>
            <el-button type="text" @click="searchExpanded = !searchExpanded">
              {{ searchExpanded ? '收起' : '展开' }}
              <i :class="searchExpanded ? 'el-icon-arrow-up' : 'el-icon-arrow-down'"></i>
            </el-button>
          </el-form-item>
        </el-form>
      </div>

      <!-- 工具栏 -->
      <div class="toolbar">
        <el-row :gutter="10" class="mb8">
          <el-col :span="1.5">
            <el-button type="primary" plain icon="el-icon-plus" size="mini" @click="handleAdd">新增</el-button>
          </el-col>
          <el-col :span="1.5">
            <el-tooltip :content="selectedRows.length === 0 ? '请先选择一条数据' : '只能选择一条数据进行复制'" placement="top" :disabled="!single">
              <span><el-button type="warning" plain icon="el-icon-document-copy" size="mini" :disabled="single" @click="handleCopy">复制</el-button></span>
            </el-tooltip>
          </el-col>
          <el-col :span="1.5">
            <el-tooltip :content="selectedRows.length === 0 ? '请先选择一条数据' : '只能选择一条数据进行修改'" placement="top" :disabled="!single">
              <span><el-button type="success" plain icon="el-icon-edit" size="mini" :disabled="single" @click="handleEdit">修改</el-button></span>
            </el-tooltip>
          </el-col>
          <el-col :span="1.5">
            <el-tooltip content="请先选择要删除的数据" placement="top" :disabled="!multiple">
              <span><el-button type="danger" plain icon="el-icon-delete" size="mini" :disabled="multiple" @click="handleDelete">删除</el-button></span>
            </el-tooltip>
          </el-col>
          <el-col :span="1.5">
            <el-button type="warning" plain icon="el-icon-download" size="mini" @click="handleExport">导出</el-button>
          </el-col>
          <el-col :span="1.5">
            <el-button type="info" plain icon="el-icon-upload2" size="mini" @click="handleImport">导入</el-button>
          </el-col>
          <div class="right-toolbar">
            <el-tooltip content="显示/隐藏搜索" placement="top">
              <el-button circle size="mini" icon="el-icon-search" @click="showSearch = !showSearch"></el-button>
            </el-tooltip>
            <el-tooltip content="刷新" placement="top">
              <el-button circle size="mini" icon="el-icon-refresh" @click="handleRefresh"></el-button>
            </el-tooltip>
            <el-tooltip content="列配置" placement="top">
              <el-button circle size="mini" icon="el-icon-setting" @click="openColumnConfig"></el-button>
            </el-tooltip>
          </div>
        </el-row>
      </div>

      <!-- 选中提示 -->
      <div class="selection-bar" v-show="ids.length > 0">
        <span>已选 <span class="count">{{ ids.length }}</span> 条</span>
        <el-button type="text" size="mini" @click="clearSelection">取消选择</el-button>
      </div>

      <!-- 数据表格（动态列） -->
      <div class="table-area">
        <el-table v-loading="loading" :data="pagedData" border size="medium" highlight-current-row @selection-change="handleSelectionChange" @sort-change="handleSortChange" ref="dataTable" row-key="id" :key="tableKey">
          <el-table-column type="selection" width="55" align="center"></el-table-column>

          <el-table-column
            v-for="col in visibleColumns"
            :key="col.prop"
            :label="col.label"
            :prop="col.prop"
            :width="col.width"
            :min-width="col.minWidth"
            :align="col.align || 'center'"
            :show-overflow-tooltip="col.prop === 'email'"
            sortable="custom">
            <template slot-scope="{row}">
              <el-link v-if="col.prop === 'id'" type="primary" @click="goDetail(row)">{{ row.id }}</el-link>
              <template v-else-if="col.prop === 'phone'">{{ row.phoneMasked }}</template>
              <template v-else-if="col.prop === 'gender'">{{ row.genderLabel }}</template>
              <el-tag v-else-if="col.prop === 'deptId'" size="small">{{ row.deptLabel }}</el-tag>
              <template v-else-if="col.prop === 'roles'">
                <el-tag v-for="r in row.roleLabels" :key="r" size="mini" effect="plain" style="margin-right:4px">{{ r }}</el-tag>
              </template>
              <el-tag v-else-if="col.prop === 'status'" :type="row.statusType" size="small">{{ row.statusLabel }}</el-tag>
              <template v-else>{{ row[col.prop] }}</template>
            </template>
          </el-table-column>

          <el-table-column label="操作" width="220" align="center" fixed="right">
            <template slot-scope="{row}">
              <el-button size="mini" type="text" icon="el-icon-key" @click="handleResetPwd(row)">重置密码</el-button>
              <el-button size="mini" type="text" icon="el-icon-user" @click="handleAssignRole(row)">分配角色</el-button>
            </template>
          </el-table-column>
        </el-table>
      </div>

      <!-- 分页 -->
      <div class="pagination-area">
        <el-pagination
          @size-change="handleSizeChange"
          @current-change="handleCurrentChange"
          :current-page="queryParams.pageNum"
          :page-sizes="[10, 20, 50]"
          :page-size="queryParams.pageSize"
          layout="total, sizes, prev, pager, next, jumper"
          :total="total">
        </el-pagination>
      </div>

      <!-- 导入对话框 -->
      <el-dialog title="导入用户数据" :visible.sync="importDialogVisible" width="600px" append-to-body class="import-dialog">
        <el-alert type="info" :closable="false" show-icon style="margin-bottom:20px">
          <template slot="title">
            <span>请下载导入模板，按字段填写后上传。</span>
            <el-link type="primary" style="margin-left:8px">下载导入模板</el-link>
          </template>
        </el-alert>
        <el-form label-width="80px">
          <el-form-item label="导入模式">
            <el-radio-group v-model="importMode" style="display:flex;flex-direction:column;gap:12px;">
              <el-radio label="incremental">
                <span style="font-weight:600;">增量更新</span>
                <div style="color:#909399;font-size:12px;margin-top:4px;padding-left:24px;">仅新增不存在的记录，更新已存在的记录，不删除现有数据</div>
              </el-radio>
              <el-radio label="full">
                <span style="font-weight:600;color:#F56C6C;">全量覆盖</span>
                <div style="color:#F56C6C;font-size:12px;margin-top:4px;padding-left:24px;">⚠ 先清空现有全部数据，再导入文件中的数据（危险操作，不可恢复）</div>
              </el-radio>
            </el-radio-group>
          </el-form-item>
        </el-form>
        <el-upload drag action="#" :auto-upload="false" :limit="1" :on-change="handleFileChange" :on-remove="handleFileRemove" :file-list="importFileList" accept=".xlsx,.csv">
          <i class="el-icon-upload"></i>
          <div class="el-upload__text">将文件拖到此处，或<em>点击上传</em></div>
        </el-upload>
        <div class="upload-tip">支持 .xlsx / .csv 文件，单次上传不超过 10MB</div>
        <div slot="footer">
          <el-button @click="importDialogVisible = false">取 消</el-button>
          <el-button type="primary" :disabled="importFileList.length === 0" :loading="importLoading" @click="submitImport">确 定</el-button>
        </div>
      </el-dialog>

      <!-- 导入结果对话框 -->
      <el-dialog title="导入结果" :visible.sync="resultDialogVisible" width="900px" append-to-body class="result-dialog">
        <el-alert :title="resultSummary" :type="resultAlertType" :closable="false" show-icon class="summary-alert"></el-alert>
        <el-tabs v-model="resultActiveTab">
          <el-tab-pane :label="'成功 (' + importSuccessList.length + ')'" name="success">
            <el-table :data="importSuccessList" border size="small" max-height="400">
              <el-table-column label="序号" prop="index" width="60" align="center"></el-table-column>
              <el-table-column label="姓名" prop="name" width="120"></el-table-column>
              <el-table-column label="部门" prop="deptLabel" width="120" align="center"></el-table-column>
              <el-table-column label="操作类型" prop="actionType" align="center">
                <template slot-scope="{row}">
                  <el-tag :type="row.actionType === '新增' ? 'success' : 'primary'" size="mini">{{ row.actionType }}</el-tag>
                </template>
              </el-table-column>
            </el-table>
          </el-tab-pane>
          <el-tab-pane :label="'失败 (' + importFailedList.length + ')'" name="failed">
            <el-table :data="importFailedList" border size="small" max-height="400" row-class-name="fail-row">
              <el-table-column label="序号" prop="index" width="60" align="center"></el-table-column>
              <el-table-column label="姓名" prop="name" width="120"></el-table-column>
              <el-table-column label="部门" prop="deptLabel" width="120" align="center"></el-table-column>
              <el-table-column label="错误原因" prop="errorMessage">
                <template slot-scope="{row}">
                  <span style="color:#F56C6C">{{ row.errorMessage }}</span>
                </template>
              </el-table-column>
            </el-table>
          </el-tab-pane>
        </el-tabs>
        <div slot="footer">
          <el-button type="primary" @click="resultDialogVisible = false">确 定</el-button>
        </div>
      </el-dialog>

      <!-- 列配置抽屉（拖拽排序 + 显示开关 + 宽度调节） -->
      <el-dialog
        title="列配置"
        :visible.sync="columnSettingVisible"
        :before-close="handleColumnConfigClose"
        width="550px"
        :close-on-click-modal="false"
        custom-class="column-config-dialog">
        <div class="column-config-container">
          <div class="config-tip">
            <i class="el-icon-info"></i>
            <span>拖拽列表项可调整列顺序，开关控制显示/隐藏（至少保留一列可见）</span>
          </div>
          <ul class="column-list" ref="columnList">
            <li
              v-for="col in localColumns"
              :key="col.prop"
              :data-prop="col.prop"
              class="column-item">
              <div class="column-item-left">
                <i class="el-icon-rank drag-handle"></i>
                <span class="column-label">{{ col.label }}</span>
              </div>
              <div class="column-item-right">
                <el-input-number
                  v-model="col.width"
                  :min="60"
                  :max="500"
                  :step="10"
                  size="mini"
                  controls-position="right"
                  style="width:110px;margin-right:10px"></el-input-number>
                <el-switch
                  :value="col.visible"
                  @change="handleVisibleChange(col, $event)"
                  active-color="#13ce66"
                  inactive-color="#dcdfe6"></el-switch>
              </div>
            </li>
          </ul>
        </div>
        <div slot="footer">
          <el-button @click="handleColumnConfigReset">重置为默认</el-button>
          <el-button type="primary" @click="handleColumnConfigSave">保存配置</el-button>
        </div>
      </el-dialog>
    </div>
  </div>

  <script src="https://unpkg.com/vue@2.6.14/dist/vue.min.js"></script>
  <script src="https://unpkg.com/element-ui@2.15.14/lib/index.js"></script>
  <script src="https://unpkg.com/sortablejs@1.15.2/Sortable.min.js"></script>
  <script src="js/interactions.js"></script>
  <script>
    // 默认列配置（含宽度、可见性）
    var DEFAULT_COLUMNS = [
      { prop: 'id',         label: '用户ID',   visible: true, width: 90,  align: 'center' },
      { prop: 'userCode',   label: '用户编号', visible: true, width: 130, align: 'center' },
      { prop: 'name',       label: '姓名',     visible: true, width: 100, align: 'center' },
      { prop: 'phone',      label: '手机号',   visible: true, width: 140, align: 'center' },
      { prop: 'email',      label: '邮箱',     visible: true, minWidth: 180, align: 'left' },
      { prop: 'gender',     label: '性别',     visible: true, width: 80,  align: 'center' },
      { prop: 'deptId',     label: '部门',     visible: true, width: 100, align: 'center' },
      { prop: 'roles',      label: '角色',     visible: true, minWidth: 180, align: 'left' },
      { prop: 'status',     label: '状态',     visible: true, width: 90,  align: 'center' },
      { prop: 'entryDate',  label: '入职日期', visible: true, width: 120, align: 'center' },
      { prop: 'createTime', label: '创建时间', visible: false, width: 170, align: 'center' }
    ];

    new Vue({
      el: '#app',
      data: function () {
        return {
          showSearch: true,
          searchExpanded: false,
          queryParams: {
            pageNum: 1, pageSize: 10,
            name: '', phone: '', deptId: '', status: '',
            roles: [], gender: '', entryDateRange: null
          },
          ids: [], selectedRows: [], single: true, multiple: true,
          loading: false,
          allData: mockTableData,
          sortProp: '', sortOrder: '',
          deptOptions: deptOptions,
          statusOptions: statusOptions,
          roleOptions: roleOptions,
          genderOptions: genderOptions,
          importDialogVisible: false,
          importMode: 'incremental',
          importFileList: [],
          importLoading: false,
          resultDialogVisible: false,
          resultActiveTab: 'failed',
          importSuccessList: importSuccessList,
          importFailedList: importFailedList,
          // 列配置
          columnSettingVisible: false,
          columns: JSON.parse(JSON.stringify(DEFAULT_COLUMNS)),
          localColumns: [],
          tableKey: 0,
          sortableInstance: null
        };
      },
      computed: {
        visibleColumns: function () {
          return this.columns.filter(function (c) { return c.visible; });
        },
        filteredData: function () {
          var q = this.queryParams;
          var data = this.allData.filter(function (row) {
            if (q.name && row.name.indexOf(q.name) === -1) return false;
            if (q.phone && row.phone.indexOf(q.phone) === -1) return false;
            if (q.deptId && row.deptId !== q.deptId) return false;
            if (q.status !== '' && q.status != null && row.status !== q.status) return false;
            if (q.gender && row.gender !== q.gender) return false;
            if (q.roles && q.roles.length) {
              var hit = q.roles.some(function (r) { return row.roles.indexOf(r) !== -1; });
              if (!hit) return false;
            }
            if (q.entryDateRange && q.entryDateRange.length === 2) {
              if (row.entryDate < q.entryDateRange[0] || row.entryDate > q.entryDateRange[1]) return false;
            }
            return true;
          });
          if (this.sortProp && this.sortOrder) {
            var prop = this.sortProp;
            var order = this.sortOrder;
            data = data.slice().sort(function (a, b) {
              var av = a[prop], bv = b[prop];
              if (av < bv) return order === 'ascending' ? -1 : 1;
              if (av > bv) return order === 'ascending' ? 1 : -1;
              return 0;
            });
          }
          return data;
        },
        total: function () { return this.filteredData.length; },
        pagedData: function () {
          var start = (this.queryParams.pageNum - 1) * this.queryParams.pageSize;
          return this.filteredData.slice(start, start + this.queryParams.pageSize);
        },
        resultSummary: function () {
          var s = this.importSuccessList.length;
          var f = this.importFailedList.length;
          if (f === 0) return '✅ 导入成功，共导入 ' + s + ' 条';
          if (s === 0) return '❌ 导入全部失败，共 ' + f + ' 条；请检查文件格式与字段';
          return '⚠ 共导入 ' + (s + f) + ' 条，成功 ' + s + ' 条，失败 ' + f + ' 条';
        },
        resultAlertType: function () {
          var f = this.importFailedList.length;
          var s = this.importSuccessList.length;
          if (f === 0) return 'success';
          if (s === 0) return 'error';
          return 'warning';
        }
      },
      methods: {
        openHelp: function (topic) { openHelpPage(topic); },
        handleQuery: function () {
          // 仅做数据过滤（通过 computed filteredData），保留搜索条件不变
          // 重置页码到第一页，但不修改 queryParams 中的搜索字段
          this.queryParams.pageNum = 1;
          this.loading = true;
          var self = this;
          setTimeout(function () { self.loading = false; self.$message.success('查询完成'); }, 400);
        },
        resetQuery: function () {
          // 仅在「重置」时清空所有搜索条件并恢复默认数据
          this.$refs.queryForm.resetFields();
          this.queryParams.entryDateRange = null;
          this.queryParams.roles = [];
          this.queryParams.pageNum = 1;
          this.loading = true;
          var self = this;
          setTimeout(function () { self.loading = false; self.$message.success('已重置'); }, 300);
        },
        handleSelectionChange: function (selection) {
          this.ids = selection.map(function (item) { return item.id; });
          this.selectedRows = selection;
          this.single = selection.length !== 1;
          this.multiple = selection.length === 0;
        },
        handleSortChange: function (col) { this.sortProp = col.prop; this.sortOrder = col.order; },
        clearSelection: function () { this.$refs.dataTable.clearSelection(); },
        handleAdd: function () { window.location.href = 'form.html?mode=add'; },
        handleCopy: function () {
          if (this.ids.length === 1) window.location.href = 'form.html?mode=copy&id=' + this.ids[0];
        },
        handleEdit: function () {
          if (this.ids.length === 1) window.location.href = 'form.html?mode=edit&id=' + this.ids[0];
        },
        handleGuide: function () {
          this.$alert('<p>欢迎使用用户管理模块！以下是快速上手指南：</p><ol><li><b>查看用户</b>：在列表中点击用户ID进入详情页</li><li><b>新增用户</b>：点击工具栏“新增”按钮</li><li><b>筛选查找</b>：使用搜索栏输入条件后点击搜索</li><li><b>列配置</b>：点击右上角⚙️图标自定义表格列显示</li></ol>', '新手引导', {
            dangerouslyUseHTMLString: true, confirmButtonText: '我知道了'
          });
        },
        handleResetPwd: function (row) {
          this.$confirm('确认重置用户「' + row.name + '」的登录密码？重置后将通过短信下发新密码。', '确认重置', {
            confirmButtonText: '确定', cancelButtonText: '取消', type: 'warning'
          }).then(function () { this.$message.success('密码重置成功'); }.bind(this)).catch(function () {});
        },
        handleAssignRole: function (row) {
          this.$message.info('打开「' + row.name + '」的分配角色弹窗（演示）');
        },
        handleDelete: function () {
          var self = this;
          var names = this.selectedRows.map(function (r) { return r.name; }).join('、');
          var selectedIds = this.selectedRows.map(function (r) { return r.id; });
          this.$confirm('确认删除以下用户？此操作不可恢复。<br/><br/>• ' + names.split('、').join('<br/>• '), '确认删除', {
            dangerouslyUseHTMLString: true, confirmButtonText: '确定', cancelButtonText: '取消', type: 'warning'
          }).then(function () {
            self.allData = self.allData.filter(function (row) { return selectedIds.indexOf(row.id) === -1; });
            self.selectedRows = [];
            self.multiple = true;
            var maxPage = Math.ceil(self.filteredData.length / self.pageSize);
            if (self.pageNum > maxPage && maxPage > 0) { self.pageNum = maxPage; }
            self.$message.success('删除成功');
          }).catch(function () {});
        },
        handleExport: function () {
          this.$confirm('是否确认导出当前查询条件下的所有用户？', '导出确认', {
            confirmButtonText: '确定', cancelButtonText: '取消', type: 'info'
          }).then(function () { this.$message.success('导出成功'); }.bind(this)).catch(function () {});
        },
        handleImport: function () {
          this.importDialogVisible = true;
          this.importFileList = [];
          this.importMode = 'incremental';
        },
        handleFileChange: function (file) { this.importFileList = [file]; },
        handleFileRemove: function () { this.importFileList = []; },
        submitImport: function () {
          var self = this;
          if (this.importMode === 'full') {
            this.$confirm('全量覆盖将清空现有数据，是否继续？', '⚠ 危险操作', {
              confirmButtonText: '确认覆盖', cancelButtonText: '取消', type: 'warning'
            }).then(function () { self.doImport(); }).catch(function () {});
          } else {
            this.doImport();
          }
        },
        doImport: function () {
          var self = this;
          this.importLoading = true;
          setTimeout(function () {
            self.importLoading = false;
            self.importDialogVisible = false;
            self.resultDialogVisible = true;
            self.resultActiveTab = self.importFailedList.length > 0 ? 'failed' : 'success';
          }, 1200);
        },
        handleRefresh: function () {
          this.loading = true;
          var self = this;
          setTimeout(function () { self.loading = false; self.$message.success('刷新完成'); }, 400);
        },
        goDetail: function (row) { window.location.href = 'detail.html?id=' + row.id; },
        handleSizeChange: function (val) { this.queryParams.pageSize = val; this.queryParams.pageNum = 1; },
        handleCurrentChange: function (val) { this.queryParams.pageNum = val; },

        /* ========== 列配置 ========== */
        openColumnConfig: function () {
          // 深拷贝当前配置作为本地编辑副本
          this.localColumns = JSON.parse(JSON.stringify(this.columns));
          this.columnSettingVisible = true;
          var self = this;
          this.$nextTick(function () { self.initSortable(); });
        },
        initSortable: function () {
          var self = this;
          if (this.sortableInstance) { this.sortableInstance.destroy(); this.sortableInstance = null; }
          var listEl = this.$refs.columnList;
          if (!listEl || typeof Sortable === 'undefined') return;
          this.sortableInstance = Sortable.create(listEl, {
            handle: '.drag-handle',
            animation: 200,
            ghostClass: 'sortable-ghost',
            chosenClass: 'sortable-chosen',
            onEnd: function (evt) {
              if (evt.oldIndex === evt.newIndex) return;
              var moved = self.localColumns.splice(evt.oldIndex, 1)[0];
              self.localColumns.splice(evt.newIndex, 0, moved);
            }
          });
        },
        handleVisibleChange: function (col, val) {
          if (!val) {
            var visibleCount = this.localColumns.filter(function (c) {
              return c !== col && c.visible;
            }).length;
            if (visibleCount === 0) {
              this.$message.warning('至少需要保留一列可见，无法关闭所有列');
              this.$nextTick(function () { col.visible = true; });
              return;
            }
          }
          col.visible = val;
        },
        handleColumnConfigSave: function () {
          var visibleCount = this.localColumns.filter(function (c) { return c.visible; }).length;
          if (visibleCount === 0) {
            this.$message.warning('至少需要保留一列可见，请至少开启一列后再保存');
            return;
          }
          this.columns = JSON.parse(JSON.stringify(this.localColumns));
          this.tableKey++;
          this.columnSettingVisible = false;
          this.$message.success('列配置已保存');
        },
        handleColumnConfigReset: function () {
          var self = this;
          this.$confirm('确定要重置为默认配置吗？', '提示', {
            confirmButtonText: '确定', cancelButtonText: '取消', type: 'warning'
          }).then(function () {
            self.columns = JSON.parse(JSON.stringify(DEFAULT_COLUMNS));
            self.tableKey++;
            self.columnSettingVisible = false;
            self.$message.success('已重置为默认列配置');
          }).catch(function () {});
        },
        handleColumnConfigClose: function (done) {
          if (this.sortableInstance) { this.sortableInstance.destroy(); this.sortableInstance = null; }
          done();
        }
      },
      mounted: function () {
        this.loading = true;
        var self = this;
        setTimeout(function () { self.loading = false; }, 600);
      }
    });
  </script>
</body>
</html>
