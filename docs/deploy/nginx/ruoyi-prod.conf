# AI-DevOps 生产环境 Nginx 配置文件
# Nginx 服务器 192.168.130.32
# 前端静态文件目录：/usr/share/nginx/html/ruoyi-ui （根据实际部署目录调整）

server {
    listen       80;
    server_name  192.168.130.32;  # 生产环境服务器IP，如果有域名可以替换为域名

    # 前端静态文件目录
    root   /usr/share/nginx/html/ruoyi-ui;
    index  index.html index.htm;

    # 字符集
    charset utf-8;

    # 日志配置
    access_log  /var/log/nginx/ruoyi-access.log;
    error_log   /var/log/nginx/ruoyi-error.log;

    # 前端静态资源
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 生产环境 API 代理
    location /prod-api/ {
        proxy_next_upstream     http_502 http_504 error timeout invalid_header;
        # 代理到 web_server（nginx.conf 里配置的 upstream 负载均衡）
        proxy_pass http://web_server/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 支持（如果需要）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 静态资源缓存配置
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Gzip 压缩配置
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;
}
