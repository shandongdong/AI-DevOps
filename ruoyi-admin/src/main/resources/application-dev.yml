# 开发环境配置
# 开发环境：前后端运行在本地 Mac，数据库/Redis 为 192.168.30.41
# 本文件自包含该环境的 Redis 与 Flyway 配置（主 application.yml 不含这两项）

spring:
  # Redis 配置
  data:
    redis:
      # 地址
      host: 192.168.30.41
      # 端口，默认为6379
      port: 6379
      # 数据库索引
      database: 0
      # 密码走环境变量，未设时用内网开发库默认值兜底
      password: ${REDIS_PASSWORD:DevOps#1024}
      # 连接超时时间
      timeout: 10s
      lettuce:
        pool:
          # 连接池中的最小空闲连接
          min-idle: 0
          # 连接池中的最大空闲连接
          max-idle: 8
          # 连接池的最大数据库连接数
          max-active: 8
          # 连接池最大阻塞等待时间（使用负值表示没有限制）
          max-wait: -1ms
  # Flyway 数据库迁移（开发环境关闭，因为要频繁修改 SQL 脚本与表结构）
  # 注意：Spring Boot 4.1.0 已移除 FlywayAutoConfiguration，spring.flyway.* 仅由
  #       ai-devops 的 FlywayConfig 用 @ConditionalOnProperty/@Value 读取生效
  flyway:
    enabled: false
    locations: classpath:db/migration
  # Spring AI 配置（凭据全部走环境变量，零明文）
  # 多模型并存：Anthropic + DeepSeek，由 ai-devops 的 AiClientConfig 手动管理各 ChatClient bean
  # 本地需 export：ANTHROPIC_BASE_URL / ANTHROPIC_AUTH_TOKEN / ANTHROPIC_MODEL / DEEPSEEK_API_KEY
  ai:
    # 禁用 ChatClientAutoConfiguration（它是单模型设计，注入单个 ChatModel；
    # 容器里有两个 ChatModel bean 时会报 NoUniqueBeanDefinitionException）。
    # 多模型由 AiClientConfig 为每个 ChatModel 各造一个 ChatClient bean。
    chat:
      client:
        enabled: false
    # Anthropic 配置,从环境变量读取 api-key,base-url,model
    anthropic:
      api-key: ${ANTHROPIC_AUTH_TOKEN}
      base-url: ${ANTHROPIC_BASE_URL}
      chat:
        model: ${ANTHROPIC_MODEL}
    # DeepSeek 配置,从环境变量读取 api-key,base-url,model
    deepseek:
      # api-key 无默认值：未设环境变量则启动失败（Assert.hasText），符合凭据约束
      api-key: ${DEEPSEEK_API_KEY}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      chat:
        model: ${DEEPSEEK_MODEL:deepseek-v4-pro}
    # MCP 客户端配置（第12篇：连外部 MCP server 调其工具）
    # 一个 client 可连多个 server（stdio + streamable-http 并存），框架自动桥接成 ToolCallbackProvider bean
    mcp:
      client:
        enabled: true
        # 同步客户端：简单直观，main/接口都能直接用。ASYNC 为异步（返回 Flux），适合响应式栈
        type: SYNC
        # MCP 工具调用超时——浏览器操作/远程文档可能慢，给足 60s
        request-timeout: 60s
        # toolcallback.enabled 默认 true：自动造 SyncMcpToolCallbackProvider bean（ToolCallbackProvider），
        # 含所有 connections 配的 server 工具，可直接注入到 ChatClient.tools()
        # stdio 传输：client 起 server 子进程，靠标准输入输出通信。本地零网络配置。
        # Playwright MCP：浏览器自动化，模型自主调 browser_navigate/click/screenshot 等
        stdio:
          connections:
            playwright:
              command: npx
              args:
                - "@playwright/mcp@latest"
        # streamable-http 传输：连远程 MCP server（HTTP）。
        # 钉钉云文档 MCP：操作文档，凭据 key 走环境变量 DINGTALK_MCP_KEY（绝不入库）
        streamable-http:
          connections:
            dingtalk-doc:
              # key 用环境变量占位：未设时整段 url 含字面 ${DINGTALK_MCP_KEY}，钉钉会拒，安全失败优于明文
              url: https://mcp-gw.dingtalk.com/server/a941bf4a3ad3834bb954063a548f5dc925adeec6fdaaa08f38b0f9bedf8fea27?key=${DINGTALK_MCP_KEY}
              endpoint: /mcp
      # MCP 服务端配置（第13篇：把自己的 @Tool 工具暴露成 MCP server，让外部 client 连）
      # 框架自动把容器里的 ToolCallbackProvider/ToolCallback bean 桥接成 MCP 工具规格并暴露
      server:
        name: ai-devops-mcp-server
        version: 1.0.0
        # 同步 server：简单直观，与 client 端 type=SYNC 对称。ASYNC 为异步（返回 Flux），适合响应式栈
        type: SYNC
        # streamable 协议（MCP 2025-03 规范）：单端点 /mcp，比 sse（已废弃的双端点）更现代
        # client 配 url: http://host:8080/mcp 连过来
        protocol: STREAMABLE
        # streamable-http.mcp-endpoint 默认 /mcp，可省略
        capabilities:
          tool: true   # 暴露工具能力（默认 true），把容器里的 @Tool 工具暴露给外部 client
        # 工具变更通知：声明 listChanged 能力，运行时 addTool/removeTool 后调 notifyToolsListChanged() 通知 client 重拉
        tool-change-notification: true
        # annotation-scanner.enabled 默认 true：扫 @McpTool 注解（本篇用 @Tool 复用路径，不依赖此扫描）

# ai-devops 工具配置（第11篇：让大模型"动手"的工具）
# 天气查询 + Shell 命令执行两套工具，配置全外置，环境差异只改配置不改代码
ai-devops:
  tool:
    # 天气查询工具（open-meteo 免费无需 key）
    weather:
      geocoding-api-url: https://geocoding-api.open-meteo.com/v1/search
      forecast-api-url: https://api.open-meteo.com/v1/forecast
      timeout: 10s
    # Shell 命令执行工具（五重护栏：白名单 + 元字符拒绝 + 工作目录隔离 + 超时 + 截断 + 审计）
    shell:
      workspace-root: ${java.io.tmpdir}/ai-devops-shell
      command-timeout: 30s
      max-output-lines: 500
      max-output-bytes: 65536
      # 白名单：只放行只读/查看类命令，rm/mv/kill 等危险命令默认不放行
      allowed-commands:
        - ls
        - cat
        - pwd
        - date
        - df
        - echo
        - head
        - tail
        - grep
        - find
        - wc
        - whoami
        - uptime
        - free

# 日志级别（开发环境开 debug，方便调试）
logging:
  level:
    com.ruoyi: debug
