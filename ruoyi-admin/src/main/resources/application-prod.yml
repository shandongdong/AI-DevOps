# 生产环境配置
# 生产环境三机部署：192.168.130.32(Nginx+前端) / 192.168.130.36+192.168.130.34(后端双机)
# 数据库：192.168.130.30:3306/ai-devops  Redis：192.168.130.31:6379
# 本文件自包含该环境的 Redis 与 Flyway 配置（主 application.yml 不含这两项）

spring:
  # Redis 配置（生产 Redis 在 .31，与 dev/test 的 .41 不同）
  data:
    redis:
      host: 192.168.130.31
      port: 6379
      database: 0
      # 密码走环境变量，未设时用占位符兜底（部署前必须 export REDIS_PASSWORD）
      password: ${REDIS_PASSWORD:changeme}
      # 连接超时时间
      timeout: 10s
      lettuce:
        pool:
          # 连接池中的最小空闲连接
          min-idle: 0
          # 连接池中的最大空闲连接
          max-idle: 8
          # 连接池的最大数据库连接数
          max-active: 8
          # 连接池最大阻塞等待时间（使用负值表示没有限制）
          max-wait: -1ms
  # Flyway 数据库迁移（生产环境启用，确保数据库版本一致）
  # 注意：Spring Boot 4.1.0 已移除 FlywayAutoConfiguration，spring.flyway.* 仅由
  #       ai-devops 的 FlywayConfig 用 @ConditionalOnProperty/@Value 读取生效。
  #       baseline 等其余参数已在 FlywayConfig.java 硬编码（baselineVersion=2 等），
  #       此处仅控制 enabled 与 locations。
  flyway:
    enabled: true
    locations: classpath:db/migration
  # Spring AI 配置（凭据全部走环境变量，零明文）
  # 多模型并存：Anthropic + DeepSeek，由 ai-devops 的 AiClientConfig 手动管理各 ChatClient bean
  # 部署前需 export：ANTHROPIC_BASE_URL / ANTHROPIC_AUTH_TOKEN / ANTHROPIC_MODEL / DEEPSEEK_API_KEY
  ai:
    # 禁用 ChatClientAutoConfiguration（单模型设计，多 ChatModel 时歧义），多模型由 AiClientConfig 管理
    chat:
      client:
        enabled: false
    anthropic:
      api-key: ${ANTHROPIC_AUTH_TOKEN}
      base-url: ${ANTHROPIC_BASE_URL}
      chat:
        model: ${ANTHROPIC_MODEL}
    deepseek:
      api-key: ${DEEPSEEK_API_KEY}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      chat:
        model: ${DEEPSEEK_MODEL:deepseek-v4-pro}

# 日志级别（生产环境收窄到 info，关闭框架 debug 噪声）
logging:
  level:
    com.ruoyi: info
    org.springframework: warn
